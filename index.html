<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Tiksha</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #10081a 0%, #05020a 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px; /* Safe padding for mobile borders */
        }

        /* Falling Flowers Layer */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        /* Fully Responsive Glassmorphic Wrapper */
        .stage-container {
            position: relative;
            z-index: 5;
            padding: 40px 30px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 220px;
            width: 100%;
            max-width: 480px; /* Adapts smoothly down to pocket phones */
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .stage-container.revealed {
            background: rgba(234, 179, 8, 0.03);
            border-color: rgba(234, 179, 8, 0.3);
            box-shadow: 0 40px 90px rgba(234, 179, 8, 0.15),
                        0 0 50px rgba(219, 39, 119, 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
        }

        /* Tap/Click Trigger Button */
        .reveal-btn {
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #db2777 0%, #9333ea 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 10px 25px rgba(147, 51, 234, 0.4);
            transition: all 0.4s ease;
            position: absolute;
            opacity: 1;
            transform: scale(1);
            z-index: 10;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }

        .reveal-btn:active {
            transform: scale(0.95);
        }

        .reveal-btn.hide {
            opacity: 0;
            transform: scale(0.8) translateY(20px);
            pointer-events: none;
        }

        /* Name Wrapper setup */
        .name-display {
            opacity: 0;
            transform: translateY(-20px) scale(0.9);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
            pointer-events: none;
            width: 100%;
        }

        .name-display.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Responsive typography scaled for small displays */
        .first-glow {
            font-size: 3.2rem; /* Scaled down for mobile safety */
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(to right, #ffffff 20%, #fef08a 50%, #f472b6 80%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 4s linear infinite;
            filter: drop-shadow(0 2px 15px rgba(234, 179, 8, 0.3));
            word-wrap: break-word;
        }

        .sub-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 12px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.8s ease 0.5s;
        }

        .name-display.show .sub-text {
            opacity: 1;
            transform: translateY(0);
        }

        /* Auto-enlarge text if seen on larger desktop monitors */
        @media(min-width: 768px) {
            .stage-container { padding: 50px 80px; min-height: 250px; }
            .first-glow { font-size: 4.5rem; letter-spacing: 12px; }
            .sub-text { font-size: 0.9rem; letter-spacing: 6px; }
            .reveal-btn { padding: 16px 36px; font-size: 1.1rem; }
        }

        @keyframes textShine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
    </style>
</head>
<body>

    <canvas id="flowerCanvas"></canvas>

    <div class="stage-container" id="mainContainer">
        <!-- Added touch event listeners directly for zero lag on mobile screens -->
        <button class="reveal-btn" id="triggerBtn" onclick="startReveal()" ontouchstart="startReveal()">Click to Open</button>

        <div class="name-display" id="nameDisplay">
            <h1 class="first-glow">Tiksha</h1>
            <p class="sub-text">You are wonderful</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        let flowers = [];
        let animationActive = false;
        let revealTriggered = false; // Prevents double firing on mobile touch+click

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Flower {
            constructor() {
                this.reset();
                this.y = Math.random() * -canvas.height - 20; // Spread out above screen initially
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                // Responsive sizing: slightly smaller petals on mobile screens so it's not cluttered
                const maxPetalSize = window.innerWidth < 768 ? 14 : 20;
                this.size = Math.random() * (maxPetalSize - 8) + 8;
                this.speedY = Math.random() * 2 + 1.5;
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.03;
                const colors = ['#ffb7c5', '#ff9ebb', '#ffc0cb', '#fef08a', '#f472b6'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y / 30) * 0.5;
                this.rotation += this.rotationSpeed;

                if (this.y > canvas.height + 20) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.fillStyle = this.color;
                
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    ctx.rotate(Math.PI * 2 / 5);
                    ctx.ellipse(0, this.size / 2, this.size / 4, this.size / 2, 0, 0, Math.PI * 2);
                }
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(0, 0, this.size / 5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                
                ctx.restore();
            }
        }

        function startReveal(e) {
            if (revealTriggered) return;
            revealTriggered = true;
            
            document.getElementById('triggerBtn').classList.add('hide');
            
            if (!animationActive) {
                // Adjust density based on screen size
                const count = window.innerWidth < 768 ? 45 : 80;
                for (let i = 0; i < count; i++) {
                    flowers.push(new Flower());
                }
                animationActive = true;
                animateFlowers();
            }

            setTimeout(() => {
                document.getElementById('mainContainer').classList.add('revealed');
                document.getElementById('nameDisplay').classList.add('show');
            }, 500);
        }

        function animateFlowers() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            flowers.forEach(flower => {
                flower.update();
                flower.draw();
            });

            requestAnimationFrame(animateFlowers);
        }
    </script>
</body>
</html>
