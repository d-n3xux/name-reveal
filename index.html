<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Tiksha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Canvas background layer for the flower particle engine, glitter trail, and confetti -->
    <canvas id="flowerCanvas"></canvas>

    <!-- Unified responsive UI display module -->
    <div class="stage-container" id="mainContainer">
        <!-- Interactive tactile action trigger button -->
        <button class="reveal-btn" id="triggerBtn">Click to Open</button>

        <!-- Dynamic output name projection display container -->
        <div class="name-display" id="nameDisplay">
            <h1 class="first-glow">Tiksha</h1>
            
            <!-- Removed the tap hint line completely for a cleaner look -->
            
            <!-- Dynamic interactive message box -->
            <p class="sub-text interactive-msg" id="messageTap">You are wonderful</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
